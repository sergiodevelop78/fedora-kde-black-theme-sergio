# SERGIO COPIADO DE KONSOLE
# foreground			#dcdccc
# background			#2c2c2c

#foreground                    #dcdccc
#background                    #2c2c2c

# =====================================================================
# CONFIGURACIÓN DE APARIENCIA Y FUENTE (Estilo Original Sergio)
# =====================================================================
#font_size                       13.0
#font_family             JetBrains Mono NL Ligth
#italic_font             JetBrains Mono NL Light Italic
# font_family      Hack Nerd Font Mono
# bold_font        auto
# italic_font      auto
# bold_italic_font auto


# Desactiva las ligaduras para mantener el espaciado clásico
disable_ligatures       always
text_composition_strategy legacy

cursor_shape            block
cursor_blink_interval   -1
shell_integration       no-cursor

# =====================================================================
# COMPORTAMIENTO Y COMPATIBILIDAD
# =====================================================================
enable_audio_bell       no
wheel_scroll_multiplier 5.0
term                    xterm-kitty

detect_urls             yes
url_style               curly
url_prefixes            file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh
allow_hyperlinks        yes
show_hyperlink_targets  yes

remember_window_size    no
initial_window_width    110c
initial_window_height   40c
confirm_os_window_close 1

scrollback_lines        10000
strip_trailing_spaces   smart
select_by_word_characters @-./_~?&=%+#
click_interval          -1.0

# Evita que los saltos de línea extraños bloqueen el pegado seguro
paste_actions           replace-dangerous-control-codes

# =====================================================================
# CONFIGURACIÓN DEL RATÓN (Copiado automático y Clic Derecho arreglado)
# =====================================================================
copy_on_select                  yes
clear_all_mouse_actions         yes

# REPARADO: Permite arrastrar el clic izquierdo para seleccionar filas de texto normalmente
mouse_map left press ungrabbed mouse_selection normal

# Comportamiento original para selección de texto (Envía directo al Bloc de Notas)
mouse_map left doublepress ungrabbed mouse_selection word
mouse_map left triplepress ungrabbed mouse_selection line

# Clic central (rueda) pega la selección rápida de la terminal
mouse_map middle release ungrabbed paste_from_selection

# Sincronización del Clic Derecho:
# Al presionar pega lo del navegador/global, al soltar maneja la selección interna
mouse_map right release ungrabbed paste_from_clipboard

# =====================================================================
# CONFIGURACIÓN DE PESTAÑAS (TAB BAR)
# =====================================================================
tab_bar_edge            top
tab_bar_align           left
tab_bar_style           slant
tab_separator           " "
tab_title_template      " {index} {title} "
tab_title_template      " {tab.active_wd}{index} "
active_tab_font_style   bold-italic
inactive_tab_font_style normal

# =====================================================================
# ATAJOS DE TECLADO (Mapeos y Corrección Ctrl+V)
# =====================================================================
map ctrl+n              new_os_window
map ctrl+shift+w        close_tab
map ctrl+t              new_tab

# Copiar y pegar unificados (Ya no se rompe con Ctrl+V por error)
map ctrl+shift+c        copy_to_clipboard
map ctrl+c              copy_and_clear_or_interrupt
map ctrl+shift+v        paste_from_clipboard
map ctrl+v              paste_from_clipboard
map shift+insert        paste_from_clipboard

# Control de tamaño de fuente
map ctrl+shift+up        increase_font_size
map ctrl+shift+down      decrease_font_size
map ctrl+shift+backspace restore_font_size
map ctrl+KP_MULTIPLY     change_font_size all 0
map ctrl+equal           change_font_size all +2.0
map ctrl+plus            change_font_size all +2.0
map ctrl+kp_add          change_font_size all +2.0
map ctrl+minus           change_font_size all -2.0
map ctrl+kp_subtract     change_font_size all -2.0

# Pantalla completa
map f11                 toggle_fullscreen

# MArgenes derecha e izquierda
window_padding_width 15 15

shell /usr/bin/zsh

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME


font_size        11.0
# BEGIN_KITTY_FONTS
font_family      family="FiraCode Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

